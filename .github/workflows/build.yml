name: GitHub CI
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'Examples/**'
      - 'src/**'
      - '!**/*.md'
    branches:
      - master
  pull_request:
    paths:
      - 'Examples/**'
      - 'src/**'
      - '!**/*.md'
    branches:
      - master
  release:
    types: released

permissions: {}

env:
  CI_REQ_DOTNET_SDK_VER: 6.0.100
  NUGET_USER: 'wtfsck'

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          .\build.ps1

      - name: upload-artifact doesn't support wildcards
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory nuget_files > $null
          Copy-Item src\bin\Release\*.*nupkg nuget_files

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: nupkg
          path: nuget_files
          if-no-files-found: error

  # Publishing is kept in its own job so that no build code runs with id-token: write
  publish:
    name: Publish to nuget.org
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    environment: nuget
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nuget_files

      - name: Get a short-lived nuget.org API key (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{env.NUGET_USER}}

      - name: Upload to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{steps.nuget-login.outputs.NUGET_API_KEY}}
        run: |
          Get-ChildItem nuget_files\dnlib.*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Make sure it builds on Linux too
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3.4.2
        with:
          dotnet-version: ${{env.CI_REQ_DOTNET_SDK_VER}}

      - name: Build
        shell: pwsh
        run: ./build.ps1
